name: Previsão do IPCA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 12 * *"   # todo dia 12 (depois da divulgação do IPCA)
  push:
    branches: [main]

jobs:
  analise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Estatística, backtest e previsão
        run: python run.py --atualizar
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: docs/
